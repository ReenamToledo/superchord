<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="shortcut icon" href="icons/Logotipo Superchord.png" type="image/x-icon">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superchord</title>
</head>

<!-- <audio autoplay loop>
    <source src="audio/lofi-audio.mp3" type="audio/mpeg">
</audio> -->

<body>

    <video autoplay muted loop class="wallpaper">
        <source src="assets/forest_wallpaper_cyber_chord.mp4" type="video/mp4">
    </video>

    <!-- Área da caixa de login -->
    <form class="login-box">

        <div class="title">
            <h1>Login Superchord</h1>
        </div>

        <!-- Área destinada as entradas do usuário -->
        <div class="sign-in">
            <section class="username">
                <input type="text" maxlength="30" placeholder="Username" id="username">
                <i class="bx bxs-user"></i>
            </section>
            <section class="password">
                <input type="password" maxlength="30" placeholder="Password" id="password">
                <i class="bx bxs-lock-alt"></i>
            </section>
        </div>
        <!-- Área destinada as entradas do usuário -->

        <!-- Área destinada a lembrar do usuário e senha -->
        <div class="memory">
            <label for="">
                <input type="checkbox"> <!--Checkbox serve para criar uma caixa de checagem-->
                Remember me
            </label>
            <a href="">Forgot password?</a>
        </div>
        <!-- Área destinada a lembrar do usuário e senha -->


        <!-- Área destinada ao botão de login registro -->
        <div class="login-button">
            <button type="submit" onclick="logar(); return false;">Login</button>
            <!--onclick="logar()" faz com que quando o usuário clicar no botão de login
             seja chamada a função logar(), que está definida no JavaScript  -->
        </div>

        <div>
            <p>Don't have an account? <a href="">Register</a></p>
        </div>
        <!-- Área destinada ao botão de login registro -->

    </form>
    <!-- Área da caixa de login -->

    <script src="script/script.js"></script>
</body>

</html>
